name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  attestations: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: server-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: toj_dev
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toj_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/toj_dev
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/toj_test
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create test database
        run: psql --host=localhost --username=postgres --dbname=toj_dev --command='CREATE DATABASE toj_test'
      - name: Migrate and test
        run: |
          bun run migrate
          DATABASE_URL="${TEST_DATABASE_URL}" bun run migrate
          bun run verify:dialog-preferences-migration
          while IFS= read -r test_file; do
            bun test --timeout 15000 "${test_file}"
          done < <(
            find . -path './node_modules' -prune -o -name '*.test.ts' -print | sort
          )
      - name: Exercise live cross-domain envelope writes
        run: |
          for mode in envelope-canary envelope; do
            for test_file in \
              src/m3.test.ts \
              src/drafts.test.ts \
              src/cloud-productivity.test.ts \
              src/reports.test.ts; do
              TOJ_CRYPTO_MODE="$mode" \
              TOJ_KEY_ENCRYPTION_PROVIDER=local \
              TOJ_ENVELOPE_CANARY_PERCENT=100 \
                bun test --timeout 15000 "$test_file"
            done
          done

  ios-debug-tests:
    name: ios-debug-tests
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # verify-search-tables.sh needs a merge base against the PR base; depth 1 has none.
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and verify pinned WebRTC artifact
        run: scripts/fetch-webrtc-xcframework.sh
      - name: Install CocoaPods dependencies
        run: |
          test -d "${DEVELOPER_DIR}"
          pod install
      - name: Verify search artifacts match the locked SQLCipher
        env:
          # A pull request diffs against its base SHA; a push against the commit it replaced.
          # Both are real commits in the checkout because this job fetches full history.
          SEARCH_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # The tokenizer tables, vectors and manifest are probed from Pods/SQLCipher rather than
          # written by hand. Regenerate and diff so a pod bump, or a hand edit, cannot silently
          # leave on-device indexes disagreeing with the code that queries them.
          #
          # The script fails closed on missing ancestry, so a shallow checkout is a build failure
          # rather than a silently skipped check. github.event.before is all-zeroes for a branch's
          # first push, where there is no previous head to compare against.
          base="${SEARCH_BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          scripts/verify-search-tables.sh "$base"
      - name: Compile real WebRTC Release path
        env:
          DERIVED_DATA: ${{ runner.temp }}/TojDerivedData
        run: |
          xcodebuild build \
            -workspace Toj.xcworkspace \
            -scheme Toj \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${DERIVED_DATA}" \
            CODE_SIGNING_ALLOWED=NO

          app_dir="$(find "${DERIVED_DATA}/Build/Products/Release-iphonesimulator" \
            -type d -name 'Toj.app' -print -quit)"
          test -n "${app_dir}"
          scripts/verify-webrtc-namespace-isolation.sh "${app_dir}"
          python3 scripts/verify-privacy-manifest.py --app-bundle "${app_dir}"
      - name: Select available iPhone simulator
        run: |
          destination_id="$(/usr/bin/python3 <<'PY'
          import json
          import re
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))

          def version(runtime):
              match = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              return tuple(map(int, match.groups(default="0"))) if match else (-1,)

          for runtime in sorted(
              (item for item in payload["devices"] if ".iOS-" in item),
              key=version,
              reverse=True,
          ):
              for device in payload["devices"][runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )"
          echo "DESTINATION_ID=${destination_id}" >> "${GITHUB_ENV}"
      - name: Run signed serialized simulator tests
        run: |
          xcodebuild test \
            -workspace Toj.xcworkspace \
            -scheme Toj \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${DESTINATION_ID}" \
            -derivedDataPath "${RUNNER_TEMP}/TojDerivedData" \
            -resultBundlePath "${RUNNER_TEMP}/TojTests.xcresult" \
            -parallel-testing-enabled NO

  repository-policy-tests:
    name: repository-policy-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Search table verification fails closed on missing ancestry
        run: scripts/tests/verify-search-tables-ancestry.test.sh
      - name: Validate scripts, plist, and coturn policy
        run: |
          find scripts server/scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 infra/coturn/validate-peer-policy.py
          python3 scripts/verify-privacy-manifest.py
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          for path in (
              Path("Toj-Info.plist"),
              Path("Toj/Toj.entitlements"),
              Path("Toj/Toj-MultitaskingCamera.entitlements"),
              Path("TojBroadcastExtension/Info.plist"),
              Path("TojBroadcastExtension/TojBroadcastExtension.entitlements"),
          ):
              with path.open("rb") as source:
                  plistlib.load(source)
          PY
      - name: Require exact group-call media SDK pins
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "client-sdk-swift": ("f70911172031fe40042266ed3bc35171224c2ef0", None),
              "livekit-uniffi-xcframework": ("61229f4032131311b997ddb1bc1cb8f5afbe30c8", "0.0.5"),
              "swift-protobuf": ("55d7a1cc5666b85c13464aea1c4b4a90feccb4c8", "1.38.1"),
              "webrtc-xcframework": ("f6017e189972b86f90e0ec406b1629828bc75748", "144.7559.3"),
          }
          resolved = json.loads(
              Path("Toj.xcworkspace/xcshareddata/swiftpm/Package.resolved").read_text()
          )
          actual = {
              pin["identity"]: (
                  pin["state"]["revision"],
                  pin["state"].get("version"),
              )
              for pin in resolved["pins"]
          }
          if actual != expected:
              raise SystemExit(f"Unexpected SwiftPM pins: {actual!r}")

          project = Path("Toj.xcodeproj/project.pbxproj").read_text()
          if 'revision = f70911172031fe40042266ed3bc35171224c2ef0;' not in project:
              raise SystemExit("LiveKit project dependency is not an exact reviewed revision")
          PY
      - name: Require immutable action references
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          failures = []
          for workflow in Path(".github/workflows").glob("*.yml"):
              for line_number, line in enumerate(workflow.read_text().splitlines(), 1):
                  match = re.search(r"^\s*-\s+uses:\s+([^\s#]+)", line)
                  if match and not re.search(r"@[0-9a-f]{40}$", match.group(1)):
                      failures.append(f"{workflow}:{line_number}: {match.group(1)}")
          if failures:
              raise SystemExit("Unpinned actions:\n" + "\n".join(failures))
          PY
